[project]
name = "refcollector"
version = "0.2.0.dev0"
description = "Turn a document's bibliography into a checked, traceable reference library."
readme = "README.md"
requires-python = ">=3.11"
# Runtime stack from spec 14.2. FastAPI is P1 (web app, decision D-05).
dependencies = [
    "mcp>=2.0,<3",
    "pydantic>=2.7,<3",
    "httpx>=0.28,<1",
    "aiolimiter>=1.1",
    "tenacity>=8.2",
    "pymupdf>=1.24,<2",  # 2.x pulls onnxruntime layout deps; untested (D-17)
    "rapidfuzz>=3.6",
    "typer>=0.12",
    "bibtexparser>=2.1,<3",
    "platformdirs>=4.2",
    "keyring>=25",
    "portalocker>=2.8",
]

[project.scripts]
refcollector = "refcollector.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "respx>=0.21",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/refcollector"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101"]  # assert is fine in tests and contracts

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
